<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#04050a">
<title>Chord Lab — Néon Studio</title>
<style>
  :root{
    --bg:#04050a;
    --card:#0c0e1a;
    --card2:#12152590;
    --txt:#eaf2ff;
    --muted:#7e86a8;
    --line:#1d2440;
    --neon:#7c5cff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--txt);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(900px 500px at 12% -8%, #2a0f55 0%, transparent 55%),
      radial-gradient(800px 500px at 95% 6%, #06304a 0%, transparent 50%),
      radial-gradient(700px 600px at 50% 110%, #1a0a3a 0%, transparent 55%),
      #04050a;
    background-attachment:fixed;
  }
  body:before{ /* grille futuriste */
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
    background-image:
      linear-gradient(rgba(120,140,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,140,255,.05) 1px, transparent 1px);
    background-size:42px 42px;
    mask-image:radial-gradient(circle at 50% 30%, #000 0%, transparent 80%);
  }
  .wrap{max-width:1000px;margin:0 auto;padding:22px 16px 90px;position:relative;z-index:1;}

  header.top{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
  .logo{
    width:48px;height:48px;border-radius:14px;flex:0 0 auto;
    background:linear-gradient(135deg,#7c5cff,#22d3ee);
    display:flex;align-items:center;justify-content:center;font-size:25px;
    box-shadow:0 0 28px rgba(124,92,255,.7), inset 0 0 12px rgba(255,255,255,.25);
  }
  header.top h1{
    font-size:23px;margin:0;line-height:1.1;letter-spacing:1px;font-weight:800;
    background:linear-gradient(90deg,#a78bff,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 24px rgba(124,92,255,.35);
  }
  header.top p{margin:3px 0 0;color:var(--muted);font-size:13px;letter-spacing:.4px;}

  .search{margin:18px 0 22px;position:relative;}
  .search input{
    width:100%;padding:14px 16px 14px 44px;border-radius:14px;border:1px solid var(--line);
    background:rgba(10,12,24,.7);color:var(--txt);font-size:15px;outline:none;
    transition:box-shadow .2s, border-color .2s;
  }
  .search input:focus{border-color:#5b6bff;box-shadow:0 0 0 1px #5b6bff, 0 0 22px rgba(91,107,255,.4);}
  .search input::placeholder{color:#566089;}
  .search:before{content:"🔎";position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.7;}

  .section-title{font-size:12px;text-transform:uppercase;letter-spacing:2.2px;color:#8b93bd;margin:0 0 14px;}
  .section-title b{color:#c7cdf5;font-weight:700;}

  /* GRID of style blocks */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;}
  .block{
    position:relative;border:1px solid transparent;text-align:left;cursor:pointer;
    border-radius:18px;padding:18px;min-height:132px;color:#fff;
    display:flex;flex-direction:column;justify-content:space-between;
    overflow:hidden;font-family:inherit;background:#0a0c18;
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .block:hover{transform:translateY(-3px);}
  .block:active{transform:scale(.97);}
  .block .bgglow{position:absolute;inset:0;opacity:.9;}
  .block .bgglow:after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.16),transparent 55%);}
  .block .emoji{font-size:30px;line-height:1;position:relative;filter:drop-shadow(0 0 10px rgba(0,0,0,.5));}
  .block .name{font-size:17px;font-weight:800;margin-top:auto;letter-spacing:.3px;position:relative;text-shadow:0 1px 6px rgba(0,0,0,.5);}
  .block .bpm{font-size:12px;opacity:.95;margin-top:4px;font-weight:700;position:relative;letter-spacing:.3px;}

  /* DETAIL */
  .detail{display:none;}
  .detail.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .back{
    background:rgba(12,14,26,.8);border:1px solid var(--line);color:var(--txt);
    border-radius:12px;padding:10px 16px;font-size:14px;cursor:pointer;font-family:inherit;
    display:inline-flex;align-items:center;gap:8px;margin-bottom:20px;transition:.18s;
  }
  .back:hover{border-color:var(--neon);box-shadow:0 0 16px color-mix(in srgb, var(--neon) 45%, transparent);}

  .detail-head{
    border-radius:20px;padding:24px;color:#fff;margin-bottom:18px;position:relative;overflow:hidden;
    border:1px solid color-mix(in srgb, var(--neon) 55%, transparent);
    box-shadow:0 0 40px color-mix(in srgb, var(--neon) 35%, transparent), inset 0 0 30px rgba(0,0,0,.35);
  }
  .detail-head .hglow{position:absolute;inset:0;opacity:.85;}
  .detail-head .emoji{font-size:42px;position:relative;}
  .detail-head h2{margin:8px 0 4px;font-size:27px;position:relative;letter-spacing:.5px;text-shadow:0 2px 14px rgba(0,0,0,.5);}
  .detail-head .meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;position:relative;}
  .chip{background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;}
  .detail-desc{color:#9aa3c9;font-size:14px;line-height:1.6;margin:0 0 22px;}

  .panel{
    background:linear-gradient(180deg, rgba(16,19,34,.85), rgba(10,12,22,.85));
    border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;
    transition:box-shadow .2s, border-color .2s;
  }
  .panel:hover{border-color:color-mix(in srgb, var(--neon) 40%, var(--line));}

  .panel-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
  .panel-name{font-size:15px;font-weight:800;letter-spacing:.3px;}
  .panel-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .play{
    flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--neon),#22d3ee);color:#03040a;font-size:17px;font-weight:900;
    display:flex;align-items:center;justify-content:center;font-family:inherit;
    box-shadow:0 0 18px color-mix(in srgb, var(--neon) 70%, transparent);transition:transform .1s;
  }
  .play:active{transform:scale(.9);}
  .play.playing{animation:pulse 1.1s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 16px color-mix(in srgb, var(--neon) 70%, transparent);}50%{box-shadow:0 0 30px #22d3ee;}}

  /* Chord chips */
  .chords{display:flex;flex-wrap:wrap;gap:9px;}
  .chord{
    background:#10142400;border:1px solid var(--line);border-radius:11px;
    padding:10px 14px;font-size:15px;font-weight:800;min-width:54px;text-align:center;
    transition:all .12s;color:#dfe6ff;
  }
  .chord.active{
    background:var(--neon);border-color:transparent;color:#03040a;transform:translateY(-3px);
    box-shadow:0 0 18px var(--neon);
  }
  .note{font-size:12.5px;color:var(--muted);margin:13px 0 0;line-height:1.55;}

  /* DRUM step sequencer (FL style) */
  .seq{overflow-x:auto;padding-bottom:4px;}
  .seq-inner{min-width:430px;}
  .row{display:grid;grid-template-columns:64px repeat(16,1fr);align-items:center;gap:5px;margin-bottom:5px;}
  .row .lab{font-size:11px;color:#9aa3c9;font-weight:700;letter-spacing:.4px;text-align:right;padding-right:6px;white-space:nowrap;}
  .cell{
    aspect-ratio:1/1;border-radius:5px;background:#141830;border:1px solid #1f2647;
    transition:background .08s, box-shadow .08s, transform .08s;
  }
  .cell.beat{background:#181d3a;}
  .cell.on{background:var(--neon);box-shadow:0 0 9px var(--neon);}
  .row.cur .cell.step{transform:scale(1.12);}
  .cell.step{outline:1px solid rgba(255,255,255,.55);}
  .cell.step.on{box-shadow:0 0 16px var(--neon), 0 0 26px var(--neon);}
  .beats{display:grid;grid-template-columns:64px repeat(16,1fr);gap:5px;margin-bottom:7px;}
  .beats span{font-size:9px;color:#4d5680;text-align:center;}
  .beats .lab{}

  .controls{display:flex;align-items:center;gap:14px;margin:4px 0 22px;flex-wrap:wrap;}
  .ctrl-grp{display:flex;align-items:center;gap:10px;background:rgba(12,14,26,.8);border:1px solid var(--line);border-radius:12px;padding:9px 14px;}
  .ctrl-grp label{font-size:12px;color:var(--muted);letter-spacing:.4px;}
  .ctrl-grp input[type=range]{width:130px;accent-color:var(--neon);}
  .ctrl-grp .val{font-size:13px;font-weight:800;min-width:62px;text-align:right;color:#cdd4ff;}

  footer{text-align:center;color:#454d72;font-size:12px;margin-top:42px;letter-spacing:.4px;}
  .empty{text-align:center;color:var(--muted);padding:40px 0;}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="logo">🎹</div>
    <div>
      <h1>CHORD LAB</h1>
      <p>Progressions · tempos · drum patterns FL Studio</p>
    </div>
  </header>

  <!-- LISTE DES STYLES -->
  <div id="home">
    <div class="search">
      <input id="searchInput" type="text" placeholder="Rechercher un style (rap, drill, lofi...)" autocomplete="off">
    </div>
    <p class="section-title"><b>Choisis un style</b></p>
    <div class="grid" id="grid"></div>
    <p class="empty" id="noResult" style="display:none">Aucun style trouvé 🤔</p>
  </div>

  <!-- DETAIL D'UN STYLE -->
  <div class="detail" id="detail">
    <button class="back" id="backBtn">← Retour aux styles</button>
    <div class="detail-head" id="detailHead"></div>
    <p class="detail-desc" id="detailDesc"></p>

    <div class="controls">
      <div class="ctrl-grp">
        <label>TEMPO</label>
        <input type="range" id="tempoSlider" min="50" max="190" value="120">
        <span class="val" id="tempoVal">120 BPM</span>
      </div>
    </div>

    <p class="section-title">🥁 <b>Drum patterns</b></p>
    <div id="drumList"></div>

    <p class="section-title" style="margin-top:26px;">🎼 <b>Progressions d'accords</b></p>
    <div id="progList"></div>
  </div>

  <footer>⚡ CHORD LAB — fait pour FL Studio &amp; co.</footer>
</div>

<script>
/* ============================================================
   UTILITAIRES
   ============================================================ */
function steps(str){ return str.padEnd(16,"-").slice(0,16).split("").map(c=>c==="x"); }

/* ============================================================
   THÉORIE MUSICALE — accords
   ============================================================ */
const NOTE_INDEX = {C:0,"C#":1,Db:1,D:2,"D#":3,Eb:3,E:4,F:5,"F#":6,Gb:6,G:7,"G#":8,Ab:8,A:9,"A#":10,Bb:10,B:11};
const QUALITIES = {
  maj:{i:[0,4,7],s:""}, min:{i:[0,3,7],s:"m"}, dim:{i:[0,3,6],s:"dim"}, aug:{i:[0,4,8],s:"aug"},
  maj7:{i:[0,4,7,11],s:"maj7"}, min7:{i:[0,3,7,10],s:"m7"}, dom7:{i:[0,4,7,10],s:"7"},
  m7b5:{i:[0,3,6,10],s:"m7b5"}, dim7:{i:[0,3,6,9],s:"dim7"},
  min9:{i:[0,3,7,10,14],s:"m9"}, maj9:{i:[0,4,7,11,14],s:"maj9"}, dom9:{i:[0,4,7,10,14],s:"9"},
  sus2:{i:[0,2,7],s:"sus2"}, sus4:{i:[0,5,7],s:"sus4"},
  add9:{i:[0,4,7,14],s:"add9"}, minadd9:{i:[0,3,7,14],s:"m(add9)"},
  min6:{i:[0,3,7,9],s:"m6"}, maj6:{i:[0,4,7,9],s:"6"},
};
function chordLabel(root,q){ return root + (QUALITIES[q]?QUALITIES[q].s:""); }
function midi(name,oct){ return 12*(oct+1) + NOTE_INDEX[name]; }
function freq(m){ return 440 * Math.pow(2,(m-69)/12); }
function chordFreqs(root,q,oct){ const Q=QUALITIES[q]||QUALITIES.maj; const b=midi(root,oct); return Q.i.map(x=>freq(b+x)); }

/* ============================================================
   MOTEUR AUDIO
   ============================================================ */
let audioCtx=null, noiseBuf=null, silentEl=null, unlocked=false;
function ctx(){
  if(!audioCtx){
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const n=audioCtx.sampleRate; noiseBuf=audioCtx.createBuffer(1,n,audioCtx.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  }
  if(audioCtx.state==="suspended") audioCtx.resume();
  return audioCtx;
}
/* WAV de silence : force iOS en mode "lecture" pour jouer même si le bouton Silence est activé */
function makeSilentAudio(){
  const sr=8000, secs=0.4, n=Math.floor(sr*secs), bytes=44+n*2;
  const buf=new ArrayBuffer(bytes), dv=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i));};
  w(0,"RIFF");dv.setUint32(4,bytes-8,true);w(8,"WAVE");w(12,"fmt ");
  dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
  dv.setUint32(24,sr,true);dv.setUint32(28,sr*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);
  w(36,"data");dv.setUint32(40,n*2,true);
  const a=new Audio(URL.createObjectURL(new Blob([buf],{type:"audio/wav"})));
  a.loop=true; a.volume=0.02; return a;
}
/* Débloque l'audio sur la 1re interaction (obligatoire sur iOS/Safari) */
function unlockAudio(){
  const ac=ctx(); if(ac.state==="suspended") ac.resume();
  try{const b=ac.createBufferSource();b.buffer=ac.createBuffer(1,1,ac.sampleRate);b.connect(ac.destination);b.start(0);}catch(e){}
  if(!silentEl){ try{silentEl=makeSilentAudio();}catch(e){} }
  if(silentEl){ silentEl.play().catch(()=>{}); }
  unlocked=true;
}
["touchend","pointerdown","click"].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}));
function noiseSrc(){ const ac=ctx(); const s=ac.createBufferSource(); s.buffer=noiseBuf; s.loop=true; return s; }
function bpm(){ return parseInt(document.getElementById("tempoSlider").value,10); }

/* ---- Accords ---- */
function playChord(freqs,start,dur){
  const ac=ctx(); const master=ac.createGain(); master.connect(ac.destination);
  master.gain.setValueAtTime(0.0001,start);
  master.gain.exponentialRampToValueAtTime(0.42,start+0.02);
  master.gain.exponentialRampToValueAtTime(0.16,start+dur*0.5);
  master.gain.exponentialRampToValueAtTime(0.0001,start+dur);
  freqs.forEach(f=>{
    const o=ac.createOscillator(),g=ac.createGain();
    o.type="triangle"; o.frequency.value=f; g.gain.value=1/freqs.length;
    o.connect(g); g.connect(master); o.start(start); o.stop(start+dur+0.05);
    const o2=ac.createOscillator(),g2=ac.createGain();
    o2.type="sine"; o2.frequency.value=f/2; g2.gain.value=0.22/freqs.length;
    o2.connect(g2); g2.connect(master); o2.start(start); o2.stop(start+dur+0.05);
  });
}

/* ---- Batterie ---- */
function env(g,t,a,d,peak){ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+d); }
const DRUMS={
  kick(t){const ac=ctx();const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(48,t+0.12);env(g,t,0.004,0.32,1);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+0.4);},
  log(t){const ac=ctx();const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(58,t+0.18);env(g,t,0.005,0.4,0.95);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+0.5);},
  "808"(t){const ac=ctx();const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(46,t+0.09);env(g,t,0.006,0.55,0.9);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+0.7);},
  snare(t){const ac=ctx();const n=noiseSrc(),hp=ac.createBiquadFilter(),g=ac.createGain();hp.type="highpass";hp.frequency.value=1400;env(g,t,0.002,0.18,0.7);n.connect(hp);hp.connect(g);g.connect(ac.destination);n.start(t);n.stop(t+0.22);const o=ac.createOscillator(),g2=ac.createGain();o.type="triangle";o.frequency.value=190;env(g2,t,0.002,0.12,0.5);o.connect(g2);g2.connect(ac.destination);o.start(t);o.stop(t+0.16);},
  clap(t){const ac=ctx();[0,0.012,0.024].forEach(off=>{const n=noiseSrc(),bp=ac.createBiquadFilter(),g=ac.createGain();bp.type="bandpass";bp.frequency.value=1200;bp.Q.value=1.2;env(g,t+off,0.001,0.09,0.6);n.connect(bp);bp.connect(g);g.connect(ac.destination);n.start(t+off);n.stop(t+off+0.12);});},
  hat(t){const ac=ctx();const n=noiseSrc(),hp=ac.createBiquadFilter(),g=ac.createGain();hp.type="highpass";hp.frequency.value=8000;env(g,t,0.001,0.04,0.4);n.connect(hp);hp.connect(g);g.connect(ac.destination);n.start(t);n.stop(t+0.06);},
  ohat(t){const ac=ctx();const n=noiseSrc(),hp=ac.createBiquadFilter(),g=ac.createGain();hp.type="highpass";hp.frequency.value=7000;env(g,t,0.001,0.28,0.4);n.connect(hp);hp.connect(g);g.connect(ac.destination);n.start(t);n.stop(t+0.32);},
  shaker(t){const ac=ctx();const n=noiseSrc(),hp=ac.createBiquadFilter(),g=ac.createGain();hp.type="highpass";hp.frequency.value=6000;env(g,t,0.004,0.05,0.28);n.connect(hp);hp.connect(g);g.connect(ac.destination);n.start(t);n.stop(t+0.07);},
  perc(t){const ac=ctx();const o=ac.createOscillator(),g=ac.createGain();o.type="triangle";o.frequency.setValueAtTime(420,t);o.frequency.exponentialRampToValueAtTime(260,t+0.1);env(g,t,0.002,0.14,0.5);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+0.18);},
  cowbell(t){const ac=ctx();[540,800].forEach(f=>{const o=ac.createOscillator(),g=ac.createGain();o.type="square";o.frequency.value=f;env(g,t,0.002,0.12,0.22);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+0.16);});},
};
const DRUM_LABEL={kick:"Kick","808":"808",log:"Log Drum",snare:"Snare",clap:"Clap",hat:"Hat",ohat:"Open Hat",shaker:"Shaker",perc:"Perc",cowbell:"Cowbell"};

/* ---- Lecture : un seul truc à la fois ---- */
let curChord=null, curDrums=null;
function stopChord(){ if(curChord){curChord.timeouts.forEach(clearTimeout);curChord.btn.classList.remove("playing");curChord.btn.textContent="▶";document.querySelectorAll(".chord.active").forEach(c=>c.classList.remove("active"));curChord=null;} }
function stopDrums(){ if(curDrums){clearInterval(curDrums.timer);cancelAnimationFrame(curDrums.raf);curDrums.btn.classList.remove("playing");curDrums.btn.textContent="▶";curDrums.grid.querySelectorAll(".cell.step").forEach(c=>c.classList.remove("step"));curDrums.grid.querySelectorAll(".row.cur").forEach(r=>r.classList.remove("cur"));curDrums=null;} }
function stopAll(){ stopChord(); stopDrums(); }

function playProgression(prog,btn,oct){
  unlockAudio(); stopAll();
  const ac=ctx(); const dur=(60/bpm())*2; const start=ac.currentTime+0.06; const timeouts=[];
  const cells=btn.closest(".panel").querySelectorAll(".chord");
  prog.chords.forEach((c,i)=>{
    playChord(chordFreqs(c[0],c[1],oct),start+i*dur,dur*0.95);
    timeouts.push(setTimeout(()=>{cells.forEach(e=>e.classList.remove("active"));if(cells[i])cells[i].classList.add("active");},(start+i*dur-ac.currentTime)*1000));
  });
  timeouts.push(setTimeout(stopAll,(prog.chords.length*dur+0.2)*1000));
  btn.classList.add("playing"); btn.textContent="■"; curChord={timeouts,btn};
}

function playDrumPattern(pat,btn,grid){
  unlockAudio(); stopAll();
  const ac=ctx(); let step=0; let nextTime=ac.currentTime+0.1; const scheduled=[];
  const rows=[...grid.querySelectorAll(".row")];
  const timer=setInterval(()=>{
    const sd=(60/bpm())/4;
    while(nextTime < ac.currentTime+0.12){
      pat.tracks.forEach((tr,ri)=>{ if(tr.on[step] && DRUMS[tr.inst]) DRUMS[tr.inst](nextTime); });
      scheduled.push({time:nextTime,step}); nextTime+=sd; step=(step+1)%16;
    }
  },25);
  function draw(){
    const now=ac.currentTime; let cur=-1;
    while(scheduled.length && scheduled[0].time<=now){ cur=scheduled.shift().step; }
    if(cur>=0){
      grid.querySelectorAll(".cell.step").forEach(c=>c.classList.remove("step"));
      rows.forEach(r=>{ const cells=r.querySelectorAll(".cell"); if(cells[cur])cells[cur].classList.add("step"); });
    }
    curDrums.raf=requestAnimationFrame(draw);
  }
  btn.classList.add("playing"); btn.textContent="■";
  curDrums={timer,raf:0,btn,grid}; curDrums.raf=requestAnimationFrame(draw);
}

/* ============================================================
   RENDU
   ============================================================ */
const grid=document.getElementById("grid"), home=document.getElementById("home"),
      detail=document.getElementById("detail"), noResult=document.getElementById("noResult");

function renderGrid(filter=""){
  grid.innerHTML=""; const f=filter.trim().toLowerCase();
  const list=STYLES.filter(s=>!f||s.name.toLowerCase().includes(f)||s.id.includes(f)||s.desc.toLowerCase().includes(f));
  noResult.style.display=list.length?"none":"block";
  list.forEach(s=>{
    const b=document.createElement("button"); b.className="block";
    b.style.borderColor=s.neon+"66";
    b.style.boxShadow=`0 0 22px ${s.neon}40, inset 0 0 0 1px ${s.neon}30`;
    b.innerHTML=`<div class="bgglow" style="background:${s.grad}"></div>
      <div class="emoji">${s.emoji}</div>
      <div><div class="name">${s.name}</div><div class="bpm">🕐 ${s.bpmMin}–${s.bpmMax} BPM</div></div>`;
    b.addEventListener("click",()=>openStyle(s.id));
    grid.appendChild(b);
  });
}

function drumGridHTML(pat){
  const beats=`<div class="beats"><span class="lab"></span>${Array.from({length:16},(_,i)=>`<span>${i%4===0?(i/4+1):""}</span>`).join("")}</div>`;
  const rows=pat.tracks.map(tr=>{
    const cells=tr.on.map((on,i)=>`<div class="cell ${on?"on":""} ${Math.floor(i/4)%2?"beat":""}"></div>`).join("");
    return `<div class="row"><div class="lab">${DRUM_LABEL[tr.inst]||tr.inst}</div>${cells}</div>`;
  }).join("");
  return `<div class="seq"><div class="seq-inner">${beats}${rows}</div></div>`;
}

function openStyle(id){
  const s=STYLES.find(x=>x.id===id); if(!s) return;
  stopAll(); home.style.display="none"; detail.classList.add("active");
  detail.style.setProperty("--neon",s.neon); window.scrollTo(0,0);

  const head=document.getElementById("detailHead");
  head.innerHTML=`<div class="hglow" style="background:${s.grad}"></div>
    <div class="emoji">${s.emoji}</div><h2>${s.name}</h2>
    <div class="meta">
      <span class="chip">🕐 ${s.bpmMin}–${s.bpmMax} BPM</span>
      <span class="chip">🎹 ${s.keys}</span>
      <span class="chip">🎼 ${s.scale}</span>
    </div>`;
  document.getElementById("detailDesc").textContent=s.desc;

  const slider=document.getElementById("tempoSlider");
  slider.min=Math.min(50,s.bpmMin-10); slider.max=Math.max(190,s.bpmMax+10); slider.value=s.defaultBpm;
  document.getElementById("tempoVal").textContent=s.defaultBpm+" BPM";

  // DRUMS
  const drumList=document.getElementById("drumList"); drumList.innerHTML="";
  s.drums.forEach(pat=>{
    const div=document.createElement("div"); div.className="panel";
    div.innerHTML=`<div class="panel-top">
        <div><div class="panel-name">🥁 ${pat.name}</div><div class="panel-sub">Pattern 16 pas · boucle au tempo choisi</div></div>
        <button class="play">▶</button></div>
      ${drumGridHTML(pat)}`;
    const btn=div.querySelector(".play"); const gridEl=div.querySelector(".seq-inner");
    btn.addEventListener("click",()=>{ if(curDrums&&curDrums.btn===btn){stopDrums();return;} playDrumPattern(pat,btn,gridEl); });
    drumList.appendChild(div);
  });

  // PROGRESSIONS
  const progList=document.getElementById("progList"); progList.innerHTML="";
  s.progs.forEach(p=>{
    const div=document.createElement("div"); div.className="panel";
    const chordsHtml=p.chords.map(c=>`<div class="chord">${chordLabel(c[0],c[1])}</div>`).join("");
    div.innerHTML=`<div class="panel-top">
        <div><div class="panel-name">${p.name}</div><div class="panel-sub">${p.key} · ${p.roman}</div></div>
        <button class="play">▶</button></div>
      <div class="chords">${chordsHtml}</div>
      ${p.note?`<p class="note">💡 ${p.note}</p>`:""}`;
    const btn=div.querySelector(".play");
    btn.addEventListener("click",()=>{ if(curChord&&curChord.btn===btn){stopChord();return;} playProgression(p,btn,3); });
    progList.appendChild(div);
  });
}

function goHome(){ stopAll(); detail.classList.remove("active"); home.style.display="block"; }

document.getElementById("backBtn").addEventListener("click",goHome);
document.getElementById("searchInput").addEventListener("input",e=>renderGrid(e.target.value));
document.getElementById("tempoSlider").addEventListener("input",e=>document.getElementById("tempoVal").textContent=e.target.value+" BPM");

renderGrid();
</script>
</body>
</html>
