<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0b14">
<title>Chord Lab — Progressions par style</title>
<style>
  :root{
    --bg:#0b0b14;
    --bg2:#12121f;
    --card:#181826;
    --card2:#1f1f30;
    --txt:#f2f2f7;
    --muted:#9a9ab0;
    --line:#2a2a3d;
    --accent:#7c5cff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#1a1730 0%,var(--bg) 55%);
    color:var(--txt);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1000px;margin:0 auto;padding:22px 16px 80px;}

  header.top{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
  .logo{
    width:46px;height:46px;border-radius:13px;flex:0 0 auto;
    background:linear-gradient(135deg,#7c5cff,#22d3ee);
    display:flex;align-items:center;justify-content:center;font-size:24px;
    box-shadow:0 8px 24px rgba(124,92,255,.35);
  }
  header.top h1{font-size:22px;margin:0;line-height:1.1;letter-spacing:.2px;}
  header.top p{margin:2px 0 0;color:var(--muted);font-size:13px;}

  .search{
    margin:18px 0 22px;position:relative;
  }
  .search input{
    width:100%;padding:14px 16px 14px 44px;border-radius:14px;border:1px solid var(--line);
    background:var(--card);color:var(--txt);font-size:15px;outline:none;
  }
  .search input::placeholder{color:#6c6c85;}
  .search:before{content:"🔎";position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.7;}

  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);margin:0 0 14px;}

  /* GRID of style blocks */
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;
  }
  .block{
    position:relative;border:none;text-align:left;cursor:pointer;
    border-radius:18px;padding:18px;min-height:128px;color:#fff;
    display:flex;flex-direction:column;justify-content:space-between;
    overflow:hidden;font-family:inherit;
    transition:transform .14s ease, box-shadow .14s ease;
    box-shadow:0 10px 28px rgba(0,0,0,.35);
  }
  .block:active{transform:scale(.97);}
  .block .emoji{font-size:30px;line-height:1;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));}
  .block .name{font-size:17px;font-weight:700;margin-top:auto;letter-spacing:.2px;}
  .block .bpm{font-size:12px;opacity:.92;margin-top:3px;font-weight:600;}
  .block .glow{position:absolute;inset:0;background:linear-gradient(140deg,rgba(255,255,255,.18),rgba(255,255,255,0) 55%);pointer-events:none;}

  /* DETAIL */
  .detail{display:none;}
  .detail.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .back{
    background:var(--card);border:1px solid var(--line);color:var(--txt);
    border-radius:12px;padding:10px 16px;font-size:14px;cursor:pointer;font-family:inherit;
    display:inline-flex;align-items:center;gap:8px;margin-bottom:20px;
  }
  .back:active{background:var(--card2);}

  .detail-head{border-radius:20px;padding:22px;color:#fff;margin-bottom:18px;position:relative;overflow:hidden;}
  .detail-head .emoji{font-size:42px;}
  .detail-head h2{margin:8px 0 4px;font-size:26px;}
  .detail-head .meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
  .chip{
    background:rgba(255,255,255,.18);backdrop-filter:blur(4px);
    border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;
  }
  .detail-desc{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 22px;}

  .prog{
    background:var(--card);border:1px solid var(--line);border-radius:16px;

  }
  .prog-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .prog-name{font-size:15px;font-weight:700;}
  .prog-key{font-size:12px;color:var(--muted);margin-top:2px;}
  .play{
    flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),#22d3ee);color:#fff;font-size:16px;
    display:flex;align-items:center;justify-content:center;font-family:inherit;
    box-shadow:0 6px 16px rgba(124,92,255,.4);transition:transform .1s;
  }
  .play:active{transform:scale(.9);}
  .play.playing{animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 6px 16px rgba(124,92,255,.4);}50%{box-shadow:0 6px 26px rgba(34,211,238,.7);}}

  .chords{display:flex;flex-wrap:wrap;gap:8px;}
  .chord{
    background:var(--card2);border:1px solid var(--line);border-radius:11px;
    padding:9px 13px;font-size:15px;font-weight:700;min-width:52px;text-align:center;

  }

  .prog-note{font-size:12.5px;color:var(--muted);margin:12px 0 0;line-height:1.5;}

  .controls{display:flex;align-items:center;gap:14px;margin:4px 0 22px;flex-wrap:wrap;}
  .ctrl-grp{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;}
  .ctrl-grp label{font-size:12px;color:var(--muted);}
  .ctrl-grp input[type=range]{width:120px;accent-color:var(--accent);}
  .ctrl-grp .val{font-size:13px;font-weight:700;min-width:54px;text-align:right;}

  footer{text-align:center;color:#5a5a72;font-size:12px;margin-top:40px;}
  .empty{text-align:center;color:var(--muted);padding:40px 0;}
</style>

<div class="wrap">

  <header class="top">

    </div>

    <div id="progList"></div>
  </div>

  <footer>🎧 Chord Lab — fait pour FL Studio &amp; co.</footer>
</div>

<script>
/* ============================================================
   THÉORIE MUSICALE — construction des accords & lecture audio
   ============================================================ */
const NOTE_INDEX = {C:0,"C#":1,Db:1,D:2,"D#":3,Eb:3,E:4,F:5,"F#":6,Gb:6,G:7,"G#":8,Ab:8,A:9,"A#":10,Bb:10,B:11};

const QUALITIES = {
  maj:    {intervals:[0,4,7],        suffix:""},
  min:    {intervals:[0,3,7],        suffix:"m"},
  dim:    {intervals:[0,3,6],        suffix:"dim"},
  aug:    {intervals:[0,4,8],        suffix:"aug"},
  maj7:   {intervals:[0,4,7,11],     suffix:"maj7"},
  min7:   {intervals:[0,3,7,10],     suffix:"m7"},
  dom7:   {intervals:[0,4,7,10],     suffix:"7"},
  m7b5:   {intervals:[0,3,6,10],     suffix:"m7b5"},
  dim7:   {intervals:[0,3,6,9],      suffix:"dim7"},
  min9:   {intervals:[0,3,7,10,14],  suffix:"m9"},
  maj9:   {intervals:[0,4,7,11,14],  suffix:"maj9"},
  dom9:   {intervals:[0,4,7,10,14],  suffix:"9"},
  sus2:   {intervals:[0,2,7],        suffix:"sus2"},
  sus4:   {intervals:[0,5,7],        suffix:"sus4"},
  add9:   {intervals:[0,4,7,14],     suffix:"add9"},
  minadd9:{intervals:[0,3,7,14],     suffix:"m(add9)"},
  min6:   {intervals:[0,3,7,9],      suffix:"m6"},
  maj6:   {intervals:[0,4,7,9],      suffix:"6"},
};

function chordLabel(root,quality){ return root + (QUALITIES[quality]?QUALITIES[quality].suffix:""); }

function midiFromName(name,octave){ return 12*(octave+1) + NOTE_INDEX[name]; }
function freqFromMidi(m){ return 440 * Math.pow(2,(m-69)/12); }

function chordFreqs(root,quality,octave){
  const q = QUALITIES[quality] || QUALITIES.maj;
  const base = midiFromName(root,octave);
  return q.intervals.map(i=>freqFromMidi(base+i));
}

/* ---- Audio engine (Web Audio API) ---- */
let audioCtx = null;
function ctx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended") audioCtx.resume();
  return audioCtx;
}

function playChord(freqs,start,dur){
  const ac = ctx();
  const master = ac.createGain();
  master.gain.value = 0.0001;
  master.connect(ac.destination);
  // enveloppe douce
  master.gain.setValueAtTime(0.0001,start);
  master.gain.exponentialRampToValueAtTime(0.5,start+0.02);
  master.gain.exponentialRampToValueAtTime(0.18,start+dur*0.5);
  master.gain.exponentialRampToValueAtTime(0.0001,start+dur);

  freqs.forEach(f=>{
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = "triangle";
    o.frequency.value = f;
    g.gain.value = 1/freqs.length;
    o.connect(g); g.connect(master);
    o.start(start); o.stop(start+dur+0.05);
    // petite couche sinus pour la chaleur
    const o2 = ac.createOscillator();
    o2.type="sine"; o2.frequency.value=f/2;
    const g2=ac.createGain(); g2.gain.value=0.25/freqs.length;
    o2.connect(g2); g2.connect(master);
    o2.start(start); o2.stop(start+dur+0.05);
  });
}

let currentPlayback = null;
function stopPlayback(){
  if(currentPlayback){
    currentPlayback.timeouts.forEach(t=>clearTimeout(t));
    currentPlayback.btn.classList.remove("playing");
    currentPlayback.btn.textContent="▶";
    document.querySelectorAll(".chord.active").forEach(c=>c.classList.remove("active"));
    currentPlayback=null;
  }
}

function playProgression(prog,btn,octave){
  stopPlayback();
  const ac = ctx();
  const bpm = parseInt(document.getElementById("tempoSlider").value,10);
  const beatsPerChord = 2;                       // 2 temps par accord
  const dur = (60/bpm)*beatsPerChord;
  const startBase = ac.currentTime + 0.06;
  const timeouts = [];
  const chordEls = btn.closest(".prog").querySelectorAll(".chord");

  prog.chords.forEach((c,i)=>{
    const freqs = chordFreqs(c[0],c[1],octave);
    playChord(freqs,startBase + i*dur,dur*0.95);
    timeouts.push(setTimeout(()=>{
      chordEls.forEach(e=>e.classList.remove("active"));
      if(chordEls[i]) chordEls[i].classList.add("active");
    }, (startBase + i*dur - ac.currentTime)*1000));
  });
  timeouts.push(setTimeout(stopPlayback, (prog.chords.length*dur + 0.2)*1000));

  btn.classList.add("playing");
  btn.textContent="■";
  currentPlayback = {timeouts,btn};
}

/* ============================================================
   RENDU & INTERACTIONS
   ============================================================ */
const grid = document.getElementById("grid");
const home = document.getElementById("home");
const detail = document.getElementById("detail");
const noResult = document.getElementById("noResult");

function renderGrid(filter=""){
  grid.innerHTML="";
  const f = filter.trim().toLowerCase();
  const list = STYLES.filter(s=>!f || s.name.toLowerCase().includes(f) || s.id.includes(f) || s.desc.toLowerCase().includes(f));
  noResult.style.display = list.length? "none":"block";
  list.forEach(s=>{
    const b=document.createElement("button");
    b.className="block";
    b.style.background=s.grad;
    b.innerHTML=`<div class="glow"></div>
      <div class="emoji">${s.emoji}</div>
      <div>
        <div class="name">${s.name}</div>
        <div class="bpm">🕐 ${s.bpmMin}–${s.bpmMax} BPM</div>
      </div>`;
    b.addEventListener("click",()=>openStyle(s.id));
    grid.appendChild(b);
  });
}

function openStyle(id){
  const s = STYLES.find(x=>x.id===id);
  if(!s) return;
  stopPlayback();
  home.style.display="none";
  detail.classList.add("active");
  window.scrollTo(0,0);

  const head=document.getElementById("detailHead");
  head.style.background=s.grad;
  head.innerHTML=`<div class="emoji">${s.emoji}</div>
    <h2>${s.name}</h2>
    <div class="meta">
      <span class="chip">🕐 ${s.bpmMin}–${s.bpmMax} BPM</span>
      <span class="chip">🎹 ${s.keys}</span>
      <span class="chip">🎼 ${s.scale}</span>
    </div>`;
  document.getElementById("detailDesc").textContent=s.desc;

  const slider=document.getElementById("tempoSlider");
  slider.min=Math.min(50,s.bpmMin-10);
  slider.max=Math.max(180,s.bpmMax+10);
  slider.value=s.defaultBpm;
  document.getElementById("tempoVal").textContent=s.defaultBpm+" BPM";

  const progList=document.getElementById("progList");
  progList.innerHTML="";
  s.progs.forEach(p=>{
    const octave = 3; // octave de base pour la lecture
    const div=document.createElement("div");
    div.className="prog";
    const chordsHtml=p.chords.map(c=>{
      const lbl=chordLabel(c[0],c[1]);
      return `<div class="chord">${lbl}</div>`;
    }).join("");
    div.innerHTML=`
      <div class="prog-top">
        <div>
          <div class="prog-name">${p.name}</div>
          <div class="prog-key">${p.key} · ${p.roman}</div>
        </div>
        <button class="play">▶</button>
      </div>
      <div class="chords">${chordsHtml}</div>
      ${p.note?`<p class="prog-note">💡 ${p.note}</p>`:""}`;
    const btn=div.querySelector(".play");
    btn.addEventListener("click",()=>{
      if(currentPlayback && currentPlayback.btn===btn){ stopPlayback(); return; }
      playProgression(p,btn,octave);
    });
    progList.appendChild(div);
  });
}

function goHome(){
  stopPlayback();
  detail.classList.remove("active");
  home.style.display="block";
}

document.getElementById("backBtn").addEventListener("click",goHome);
document.getElementById("searchInput").addEventListener("input",e=>renderGrid(e.target.value));
document.getElementById("tempoSlider").addEventListener("input",e=>{
  document.getElementById("tempoVal").textContent=e.target.value+" BPM";
});

renderGrid();
</script>
